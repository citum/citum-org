<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — Citum News</title>
<meta name="description" content="{{SUMMARY}}">
<meta name="theme-color" content="#FBFBF9">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20fill='%23FBFBF9'/%3E%3Ctext%20x='32'%20y='46'%20font-family='Georgia,serif'%20font-size='42'%20text-anchor='middle'%20fill='%23131312'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preload" as="font" type="font/woff2" href="../fonts/Archivo-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="../fonts/Newsreader-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="../fonts/Newsreader-Italic-latin.woff2" crossorigin>
<link rel="stylesheet" href="../theme.css">
<style>
  /* Lightbox (page-specific; paired with the script below) */
  .prose img{ cursor:zoom-in; }
  .lightbox-overlay{
    position:fixed; top:0; left:0; width:100%; height:100%;
    background-color:rgba(19,19,18,.92);
    display:flex; align-items:center; justify-content:center;
    z-index:9999; cursor:zoom-out;
    animation:lightboxFadeIn .2s ease-out;
  }
  .lightbox-img{
    max-width:95%; max-height:95%; object-fit:contain;
    box-shadow:0 0 30px rgba(0,0,0,.5);
    animation:lightboxZoomIn .2s ease-out;
  }
  @keyframes lightboxFadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes lightboxZoomIn{ from{ transform:scale(.9); opacity:0; } to{ transform:scale(1); opacity:1; } }
  @media (prefers-reduced-motion: reduce){
    .lightbox-overlay, .lightbox-img{ animation:none; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<svg class="grain" aria-hidden="true" focusable="false">
  <filter id="grainF"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <rect width="100%" height="100%" filter="url(#grainF)"/>
</svg>

<header class="site" id="siteHeader">
  <div class="brand">
    <a class="wordmark" id="wordmark" href="../">CITUM</a>
    <span class="subline">A citation engine</span>
  </div>
  <nav class="primary" aria-label="Primary">
    <a href="../#why">Why</a>
    <a href="../#for-you">For you</a>
    <a href="../#install">Install</a>
    <a href="/news/" aria-current="page">News</a>
    <a href="https://docs.citum.org">Docs</a>
    <a href="https://github.com/citum">GitHub</a>
  </nav>
</header>

<main id="main">
  <div class="wrap">
    <article>
      <header class="post-header">
        <p class="post-date">{{DATE}}</p>
        <h1>{{TITLE}}</h1>
        <p class="summary">{{SUMMARY}}</p>
      </header>

      <div class="prose">
        {{CONTENT}}
      </div>

      <div class="post-back">
        <a href="/news/">← Back to news</a>
      </div>
    </article>
  </div>
</main>

<footer class="colophon">
  <div class="wrap">
    <p>Citum — a citation engine. Source on <a href="https://github.com/citum">GitHub</a>. <a href="https://docs.citum.org">Docs</a> · <a href="/news/">News</a> · <span>Hub — coming soon</span>.</p>
    <p class="fine">Set in Archivo and Newsreader. No trackers, no cookies, no external requests.</p>
  </div>
</footer>

<script>
(function(){
  var header = document.getElementById('siteHeader');
  function onScroll(){
    if(window.scrollY > 12){ header.classList.add('scrolled'); }
    else{ header.classList.remove('scrolled'); }
  }
  onScroll();
  window.addEventListener('scroll', onScroll, { passive:true });

  requestAnimationFrame(function(){
    setTimeout(function(){
      document.getElementById('wordmark').classList.add('loaded');
    }, 80);
  });
})();
</script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const images = document.querySelectorAll('.prose img');

    images.forEach(img => {
      // Skip images that are already wrapped in links
      if (img.closest('a')) return;

      img.addEventListener('click', () => {
        const overlay = document.createElement('div');
        overlay.className = 'lightbox-overlay';

        const zoomedImg = document.createElement('img');
        zoomedImg.src = img.src;
        zoomedImg.alt = img.alt;
        zoomedImg.className = 'lightbox-img';

        overlay.appendChild(zoomedImg);
        document.body.appendChild(overlay);

        document.body.style.overflow = 'hidden';

        const closeLightbox = () => {
          overlay.remove();
          document.body.style.overflow = '';
          document.removeEventListener('keydown', handleEsc);
        };

        const handleEsc = (e) => {
          if (e.key === 'Escape') closeLightbox();
        };

        overlay.addEventListener('click', closeLightbox);
        document.addEventListener('keydown', handleEsc);
      });
    });
  });
</script>
</body>
</html>
